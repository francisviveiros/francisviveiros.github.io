<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente | Portafolio</title>
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 30px;
            text-align: center;
        }

        .gif-container {
            max-width: 350px;
            width: 100%;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            outline: none;
            box-shadow: none;
        }

        .social-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #f5f5f5;
            color: #333333;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .social-btn:hover {
            background-color: #222222;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        footer {
            font-size: 14px;
            color: #777777;
            letter-spacing: 0.5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Contenedor del GIF (reemplaza 'tu-imagen.gif' por el enlace o nombre de tu archivo) -->
        <div class="gif-container">
            <img src="https://media.giphy.com/media/xT5LMFZDsj0AKUDYTS/giphy.gif" 
                 alt="En Construcción" 
                 class="w-full h-full object-contain"
                 onerror="this.src='https://placehold.co/250x250/ffffff/171717?text=Proximamente'">
        </div>

        <!-- Botones de redes sociales y contacto lado a lado -->
        <div class="social-buttons">
            <!-- Instagram -->
            <a href="https://instagram.com/francisviveiros" target="_blank" class="social-btn" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <!-- LinkedIn -->
            <a href="https://linkedin.com/in/francisviveiros" target="_blank" class="social-btn" title="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <!-- Contacto -->
            <a href="mailto:hello@francisviveiros.com" class="social-btn" title="Contacto">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
    </div>

    <!-- Pie de página -->
    <footer>
        © 2026 — Todos los derechos reservados.
    </footer>

</body>
</html>
